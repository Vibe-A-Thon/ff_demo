version: "3.8"

services:
  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  db:
    image: postgres:15
    environment:
      POSTGRES_DB: fraudforge
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  chromadb:
    image: chromadb/chroma:latest
    ports:
      - "8001:8000"
    volumes:
      - chroma_data:/chroma/chroma

  neo4j:
    image: neo4j:5.15
    environment:
      NEO4J_AUTH: neo4j/password
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      MONGO_URL: mongodb://mongo:27017
      DB_NAME: ff_demo
      JWT_SECRET_KEY: dev_secret
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      CORS_ORIGINS: "*"
      DATABASE_URL: postgresql://user:password@db:5432/fraudforge
      REDIS_URL: redis://redis:6379
      CHROMA_URL: http://chromadb:8000
      NEO4J_URL: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: password
    depends_on:
      - mongo
      - db
      - redis
      - chromadb
      - neo4j
    ports:
      - "8000:8000"

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        REACT_APP_BACKEND_URL: http://localhost:8000
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  mongo_data:
  postgres_data:
  chroma_data:
  neo4j_data:
