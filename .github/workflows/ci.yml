name: CI

on:
  push:
    branches: ["main", "dev_local"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Lint (flake8)
        run: |
          flake8 backend/app tests

      - name: Type check (mypy)
        run: |
          mypy backend/app

      - name: Security scan (bandit)
        run: |
          bandit -r backend/app -ll

      - name: Secret scan (placeholder)
        run: |
          echo "Secret scanning step placeholder"

      - name: Run tests with coverage
        run: |
          pytest --cov=backend/app --cov-report=term-missing --cov-report=xml --cov-fail-under=85
