version: 1.0
prohibited_patterns:
  - "\\b\d{3}-\\d{2}-\\d{4}\\b" # SSN
  - "\\b\d{9,}\\b" # long numeric identifiers
  - "\\b[0-9]{16}\\b" # card-like numbers
  - "\\baccount\\s*number\\b"
  - "\\brouting\\s*number\\b"
  - "\\biban\\b"
  - "\\bswift\\b"
  - "\\bpan\\b"
  - "\\bssn\\b"
  - "\\bpassport\\b"
  - "\\bdriver\\s*license\\b"
  - "@" # email-like
  - "\\b(?:\d{1,3}\\.){3}\d{1,3}\\b" # IPv4
  - "\\bhttps?://\\S+" # URLs
prohibited_keywords:
  - "account id"
  - "case id"
  - "ticket id"
  - "employee id"
  - "customer id"
  - "bank a"
  - "bank b"
