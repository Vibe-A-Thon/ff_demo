tools:
  - name: retrieve_context
    schema:
      type: object
      properties:
        query:
          type: string
        top_k:
          type: integer
          minimum: 1
          maximum: 20
      required: [query]
  - name: fetch_evidence
    schema:
      type: object
      properties:
        evidence_id:
          type: string
      required: [evidence_id]
